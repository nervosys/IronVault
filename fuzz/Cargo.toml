[package]
name = "ironvault-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"

[dependencies.ironvault]
path = ".."

# Prevent this from interfering with workspaces
[workspace]
members = ["."]

[[bin]]
name = "fuzz_crypto_roundtrip"
path = "fuzz_targets/fuzz_crypto_roundtrip.rs"
doc = false

[[bin]]
name = "fuzz_format_detection"
path = "fuzz_targets/fuzz_format_detection.rs"
doc = false

[[bin]]
name = "fuzz_model_metadata"
path = "fuzz_targets/fuzz_model_metadata.rs"
doc = false

[[bin]]
name = "fuzz_version_parsing"
path = "fuzz_targets/fuzz_version_parsing.rs"
doc = false

[[bin]]
name = "fuzz_conversion_pipeline"
path = "fuzz_targets/fuzz_conversion_pipeline.rs"
doc = false

[[bin]]
name = "fuzz_pickle_scanner"
path = "fuzz_targets/fuzz_pickle_scanner.rs"
doc = false

[[bin]]
name = "fuzz_diff_engine"
path = "fuzz_targets/fuzz_diff_engine.rs"
doc = false

[[bin]]
name = "fuzz_model_card_parser"
path = "fuzz_targets/fuzz_model_card_parser.rs"
doc = false
