name: CI
# Security note (S-02): The IRONVAULT_PASSPHRASE environment variable is
# used only during integration tests. Configure it as a masked GitHub Actions
# secret (Settings -> Secrets -> Actions) -- never hardcode it in workflow files.
# All secret values are automatically masked in logs by GitHub Actions, but
# ensure your test scripts do not echo or print passphrases to stdout/stderr.

on:
  # master is this repository's default branch. Omitting it meant these jobs
  # never ran on a push to the default branch — the whole suite, clippy, MSRV,
  # docs, coverage, fuzz and benchmarks were silently skipped.
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test Suite
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust: [stable, beta]

    steps:
    - uses: actions/checkout@v7

    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ matrix.rust }}
        components: rustfmt, clippy

    - name: Cache cargo
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

    - name: Build
      run: cargo build --features "full,graphql" --verbose

    - name: Run tests
      run: cargo test --features "full,graphql" --verbose

    - name: Run clippy
      run: cargo clippy --features "full,graphql" --all-targets -- -D warnings
      # Gate on stable only. Beta ships new lints every six weeks, so gating on
      # it turns CI red on a schedule for reasons unrelated to the change being
      # tested — `chunks_exact_to_as_chunks` and `unused_async` did exactly
      # that here. The beta run still happens and its findings still show up in
      # the log, which is the early warning worth having; it just does not
      # block. Build and tests are gated on beta as normal.
      continue-on-error: ${{ matrix.rust != 'stable' }}

    - name: Check formatting
      run: cargo fmt -- --check

  feature-matrix:
    name: Feature Combinations
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # `full,graphql` is covered by the Test Suite job. These are the
        # combinations it does NOT build — they regressed unnoticed before.
        features: ["", "s3", "azure", "cloud", "api", "database", "python", "otel"]
    steps:
    - uses: actions/checkout@v7

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy

    # pyo3's build script needs an interpreter to link against.
    - name: Install Python
      if: matrix.features == 'python'
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'

    - name: Cache cargo
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-features-${{ hashFiles('**/Cargo.lock') }}

    - name: Clippy (${{ matrix.features && matrix.features || 'default' }})
      run: |
        if [ -z "${{ matrix.features }}" ]; then
          cargo clippy --all-targets -- -D warnings
        else
          cargo clippy --features "${{ matrix.features }}" --all-targets -- -D warnings
        fi

  msrv:
    name: MSRV (1.89)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v7

    - name: Install Rust 1.89
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: "1.89"

    - name: Cache cargo
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-msrv-${{ hashFiles('**/Cargo.lock') }}

    - name: Check (MSRV)
      run: cargo check --features "full,graphql"

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v7

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Build Rustdoc API reference
      run: cargo doc --lib --no-deps --features "full,graphql"
      env:
        RUSTDOCFLAGS: "-D warnings"

    - name: Copy API docs to mkdocs site
      run: |
        mkdir -p website/public/mkdocs/api
        cp -r target/doc/* website/public/mkdocs/api/

    - name: Upload API docs artifact
      uses: actions/upload-artifact@v7
      with:
        name: api-docs
        path: website/public/mkdocs/api/
        retention-days: 30

  python:
    name: Python Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v7

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    - name: Install Python deps
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run Python tests
      run: python -m pytest tests/test_ironvault.py -v

    # agents.json carried a `$schema` pointer that nothing checked, aimed for
    # most of its life at a domain the project does not own. The schema is now
    # published under website/public/schemas/; this is what keeps the manifest
    # honest against it, and checks every path in `discovery` exists.
    - name: Validate the agent discovery manifest
      run: python scripts/validate_agents_json.py

  fuzz:
    name: Fuzz Testing
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'push'
    steps:
    - uses: actions/checkout@v7

    - name: Install Rust nightly
      uses: dtolnay/rust-toolchain@nightly

    - name: Install cargo-fuzz
      run: cargo install cargo-fuzz --locked

    - name: Cache cargo
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
          fuzz/target
        key: ${{ runner.os }}-fuzz-${{ hashFiles('**/Cargo.lock') }}

    - name: Fuzz crypto_roundtrip
      run: cargo +nightly fuzz run fuzz_crypto_roundtrip -- -max_total_time=30

    - name: Fuzz format_detection
      run: cargo +nightly fuzz run fuzz_format_detection -- -max_total_time=30

    - name: Fuzz model_metadata
      run: cargo +nightly fuzz run fuzz_model_metadata -- -max_total_time=30

    - name: Fuzz version_parsing
      run: cargo +nightly fuzz run fuzz_version_parsing -- -max_total_time=30

    - name: Fuzz conversion_pipeline
      run: cargo +nightly fuzz run fuzz_conversion_pipeline -- -max_total_time=30

    - name: Fuzz pickle_scanner
      run: cargo +nightly fuzz run fuzz_pickle_scanner -- -max_total_time=30

    - name: Fuzz diff_engine
      run: cargo +nightly fuzz run fuzz_diff_engine -- -max_total_time=30

    - name: Fuzz model_card_parser
      run: cargo +nightly fuzz run fuzz_model_card_parser -- -max_total_time=30

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v7

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install cargo-audit
      run: cargo install cargo-audit --locked

    - name: Run audit
      run: cargo audit

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
    - uses: actions/checkout@v7

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache cargo
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-coverage-${{ hashFiles('**/Cargo.lock') }}

    - name: Install cargo-llvm-cov
      run: cargo install cargo-llvm-cov --locked

    - name: Generate coverage
      run: cargo llvm-cov --features "full,graphql" --lcov --output-path lcov.info

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7
      with:
        files: ./lcov.info
        fail_ci_if_error: false

  integration:
    name: CLI Integration Tests
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - uses: actions/checkout@v7

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache cargo
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-integration-${{ hashFiles('**/Cargo.lock') }}

    - name: Build binary
      run: cargo build --features "full,graphql"

    - name: Run CLI integration tests
      run: cargo test --test cli_tests --features "full,graphql" -- --test-threads=1

  deny:
    name: Dependency Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v7

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install cargo-deny
      run: cargo install cargo-deny --locked

    - name: Check licenses & advisories
      run: cargo deny check

  benchmarks:
    name: Benchmark Tracking
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event_name == 'push'
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v7

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache cargo
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-bench-${{ hashFiles('**/Cargo.lock') }}

    - name: Run benchmarks
      run: cargo bench --features "full,graphql" -- --output-format bencher | tee bench-output.txt

    # History lives in a cached JSON file rather than a `gh-pages` branch.
    # `benchmark-data-dir-path` makes the action fetch `gh-pages` to read and
    # write its data — and this repository has no such branch, so the step
    # failed every run with "couldn't find remote ref gh-pages". The
    # benchmarks ran and their results were discarded. `auto-push: false`
    # alone does not help: it stops the push, not the fetch.
    #
    # Creating a published branch is a repository decision, not a build fix,
    # so this uses the action's documented alternative instead.
    - name: Restore benchmark history
      uses: actions/cache@v6
      with:
        path: ./cache
        key: ${{ runner.os }}-benchmark-history

    - name: Store benchmark results
      uses: benchmark-action/github-action-benchmark@v1
      with:
        name: IronVault Benchmarks
        tool: cargo
        output-file-path: bench-output.txt
        github-token: ${{ secrets.GITHUB_TOKEN }}
        external-data-json-path: ./cache/benchmark-data.json
        alert-threshold: "150%"
        comment-on-alert: true
        fail-on-alert: false

  mkdocs:
    name: MkDocs Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    - name: Install mkdocs
      # mkdocs.yml declares the `minify` plugin, which is a separate package —
      # without it the build fails at config load, before any page is rendered.
      run: pip install mkdocs-material mkdocs-minify-plugin pyyaml

    # docs/REST_API.md is derived from .well-known/openapi.yaml, so a spec
    # change that skips regeneration is a stale page. Fail here rather than
    # publish documentation that disagrees with the server.
    - name: Check the REST API reference is current
      run: python scripts/gen_api_reference.py --check

    - name: Build docs (strict)
      run: mkdocs build --strict

  website:
    name: Website
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # The website had no CI job at all, which is why its linter drifted to 866
    # problems unnoticed and a `require()` call sat in a component. Building it
    # here means a broken page fails the PR rather than the deploy.
    steps:
    - uses: actions/checkout@v7

    - name: Set up Node
      uses: actions/setup-node@v6
      with:
        node-version: "22"
        cache: npm
        cache-dependency-path: website/package-lock.json

    - name: Install
      working-directory: website
      run: npm ci

    - name: Lint
      working-directory: website
      run: npm run lint

    - name: Type-check
      working-directory: website
      run: npx tsc --noEmit

    - name: Build
      working-directory: website
      run: npm run build

    # The browser download is the one step here that reaches the network for
    # something large, and it is the step that hung for 91 minutes on ae39fc9
    # against a job that normally finishes in one. Caching it means the usual
    # run does not download at all.
    #
    # Keyed on the pinned Playwright version rather than the whole lockfile:
    # the browser build is tied to that version, so an unrelated dependency
    # bump should not throw the browsers away.
    - name: Resolve Playwright version
      id: pw
      working-directory: website
      run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

    - name: Cache Playwright browsers
      id: pw-cache
      uses: actions/cache@v6
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ steps.pw.outputs.version }}

    # Only chromium: the toggle's logic is storage plus a media query, and
    # nothing here is engine-specific enough to pay for three browsers.
    #
    # On a cache hit only the apt dependencies are installed; the browser
    # itself is already on disk. `--with-deps` is not cacheable, so it always
    # runs, but it is seconds rather than a download.
    - name: Install Playwright browser
      working-directory: website
      run: |
        if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
          npx playwright install-deps chromium
        else
          npx playwright install --with-deps chromium
        fi

    - name: End-to-end tests
      working-directory: website
      run: npm test
