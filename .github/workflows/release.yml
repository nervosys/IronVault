name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build-release:
    name: Build Release
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: iv
            asset_name: iv-linux-amd64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact_name: iv
            asset_name: iv-linux-musl-amd64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: iv.exe
            asset_name: iv-windows-amd64.exe
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: iv
            asset_name: iv-darwin-amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: iv
            asset_name: iv-darwin-arm64

    steps:
    - uses: actions/checkout@v7

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - name: Install musl tools (Linux musl)
      if: matrix.target == 'x86_64-unknown-linux-musl'
      run: sudo apt-get install -y musl-tools

    # `--features api` on both steps, deliberately.
    #
    # Through 5.1.0 these built with default features, so no released binary
    # ever contained `iv serve` -- `iv serve --help` answered "unrecognized
    # subcommand" on every download, while the README offered the prebuilt
    # binary a few lines above the REST API documentation. The 14 endpoints
    # added in 5.1.0 were unreachable for anyone who had not built from source.
    #
    # The test step needs it too: without the feature, `cargo test` skips every
    # `#![cfg(feature = "api")]` suite, so the release gate was not running the
    # API, auth, drift, or reconciliation tests it appears to run.
    - name: Run tests
      if: matrix.target != 'aarch64-apple-darwin'
      run: cargo test --release --features api --target ${{ matrix.target }}

    - name: Build
      run: cargo build --release --features api --target ${{ matrix.target }}

    - name: Strip binary (Unix)
      if: runner.os != 'Windows'
      run: strip target/${{ matrix.target }}/release/${{ matrix.artifact_name }}

    - name: Rename binary
      shell: bash
      run: |
        cp target/${{ matrix.target }}/release/${{ matrix.artifact_name }} ${{ matrix.asset_name }}

    - name: Generate SHA-256 checksum
      shell: bash
      run: |
        sha256sum ${{ matrix.asset_name }} > ${{ matrix.asset_name }}.sha256

    - name: Extract changelog for release
      if: matrix.target == 'x86_64-unknown-linux-gnu'
      id: changelog
      shell: bash
      run: |
        # Extract the section for this version from CHANGELOG.md
        VERSION=${GITHUB_REF_NAME#v}
        BODY=$(awk "/^## \[?${VERSION}\]?/{found=1; next} /^## \[?[0-9]/{if(found) exit} found{print}" CHANGELOG.md)
        echo "body<<EOF" >> "$GITHUB_OUTPUT"
        echo "$BODY" >> "$GITHUB_OUTPUT"
        echo "EOF" >> "$GITHUB_OUTPUT"

    # Uploaded as a DRAFT, and published only once every matrix leg has
    # succeeded (see `publish-release`). Each leg calls this action, so the
    # first one to finish creates the release -- and when a later leg failed,
    # that left a public "Latest" release carrying whichever binaries happened
    # to be ready. v4.2.0 shipped that way: 2 assets of 10, no crates.io
    # publish, and marked Latest. A draft is invisible to users until the
    # matrix is green.
    - name: Upload Release Asset (draft)
      uses: softprops/action-gh-release@v3
      with:
        draft: true
        body: ${{ steps.changelog.outputs.body }}
        files: |
          ${{ matrix.asset_name }}
          ${{ matrix.asset_name }}.sha256

  publish-release:
    name: Publish GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Undraft the release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_REPO: ${{ github.repository }}
        TAG: ${{ github.ref_name }}
      run: |
        set -euo pipefail
        # Reached only when all five builds passed, so the asset set is complete.
        gh release edit "$TAG" --draft=false --latest
        echo "Published $TAG with $(gh release view "$TAG" --json assets --jq '.assets | length') assets."

  publish-crate:
    name: Publish to crates.io
    needs: build-release
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    # `cargo publish` reports a missing token as "please provide a non-empty
    # token", which does not say which secret is missing or where to set it.
    # The v3.0.0 release failed exactly this way.
    - name: Check the registry token is configured
      env:
        CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      run: |
        if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
          echo "::error::CARGO_REGISTRY_TOKEN is not set on this repository."
          echo "Add it under Settings -> Secrets and variables -> Actions,"
          echo "using a crates.io token scoped to publish-update for this crate,"
          echo "then re-run this job. Nothing has been published."
          exit 1
        fi

    - name: Publish to crates.io
      env:
        CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      run: cargo publish --no-verify

  # The Python package version-bumped alongside the crate and the wheel built
  # in CI, but no workflow ever published it — so every release left PyPI
  # showing whatever was last uploaded by hand, regardless of what the tag said.
  build-wheels:
    name: Build wheels (${{ matrix.os }})
    needs: build-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    - name: Build wheels
      uses: PyO3/maturin-action@v1
      with:
        # Features come from `[tool.maturin]` in pyproject.toml. Passing
        # --features here would override that list and drop
        # `pyo3/extension-module`, which the wheel will not work without.
        args: --release --out dist
        sccache: "true"

    - name: Upload wheels
      uses: actions/upload-artifact@v7
      with:
        name: wheels-${{ matrix.os }}
        path: dist

  build-sdist:
    name: Build sdist
    needs: build-release
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Build sdist
      uses: PyO3/maturin-action@v1
      with:
        command: sdist
        args: --out dist

    - name: Upload sdist
      uses: actions/upload-artifact@v7
      with:
        name: wheels-sdist
        path: dist

  publish-python:
    name: Publish to PyPI
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    steps:
    - name: Download all wheels
      uses: actions/download-artifact@v8
      with:
        pattern: wheels-*
        merge-multiple: true
        path: dist

    - name: Check the PyPI token is configured
      env:
        MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
      run: |
        if [ -z "$MATURIN_PYPI_TOKEN" ]; then
          echo "::error::PYPI_API_TOKEN is not set on this repository."
          echo "Add it under Settings -> Secrets and variables -> Actions,"
          echo "using a PyPI token scoped to this project, then re-run this job."
          echo "Nothing has been published. The built wheels are attached to"
          echo "this run as artifacts and can be uploaded by hand."
          exit 1
        fi
        ls -l dist

    - name: Publish to PyPI
      uses: PyO3/maturin-action@v1
      env:
        MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
      with:
        command: upload
        args: --non-interactive --skip-existing dist/*
