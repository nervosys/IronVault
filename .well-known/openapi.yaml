  - name: Compliance
    description: FIPS 140-3, CVE, MITRE ATT&CK, and CMMC 2.0 compliance
  - name: RAG
    description: Retrieval-Augmented Generation knowledge base
  - name: Observability
    description: Health, metrics, audit log, and events
  - name: Tags
    description: Model tagging, annotations, and search
  - name: Access Control
    description: Role-based access control (RBAC)
  - name: Webhooks
    description: HTTP notification targets for vault events
  - name: Policies
    description: Retention policy management
  - name: Profiles
    description: Configuration profile management
  - name: Lineage
    description: Cross-model lineage DAG
  - name: Plugins
    description: Plugin system management
  - name: Quantization
    description: Quantization pipeline and profile management
  - name: Evaluation
    description: Model evaluation harness
  - name: Backups
    description: Backup scheduling and history
  - name: Multi-Vault
    description: Multi-vault registry and switching
