openapi: 3.1.0
info:
  title: IronVault API
  description: |
    REST & GraphQL API for IronVault — encrypted AI/ML model management
    with versioning, format conversion, compliance validation, and RAG.
    
    Requires the `api` cargo feature: `cargo build --features api`
    Start with: `iv serve --port 8080`
  version: 5.0.0
  license:
    name: AGPL-3.0-or-later
    url: https://www.gnu.org/licenses/agpl-3.0.html
  contact:
    name: NERVOSYS AI Team
    url: https://github.com/nervosys/IronVault

servers:
  - url: http://localhost:8080
    description: Local development server

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ModelVersion:
      type: object
      properties:
        version:
          type: integer
          description: Sequential version number
        checkpoint_id:
          type: string
          format: uuid
        timestamp:
          type: string
          format: date-time
        parent_version:
          type: integer
          nullable: true
        format:
          type: string
        size_bytes:
          type: integer
          format: int64
        compressed_size_bytes:
          type: integer
          format: int64
        checksum_sha256:
          type: string
        metadata:
          type: object
          additionalProperties:
            type: string

    ModelMetadata:
      type: object
      required: [name, format]
      properties:
        name:
          type: string
        format:
          type: string
        description:
          type: string
        framework:
          type: string
        task:
          type: string
        architecture:
          type: string
        parameters:
          type: integer
          format: int64
        custom_fields:
          type: object
          additionalProperties:
            type: string

    ModelCard:
      type: object
      properties:
        model_details:
          $ref: '#/components/schemas/ModelDetails'
        intended_use:
          $ref: '#/components/schemas/IntendedUse'
        training_data:
          $ref: '#/components/schemas/TrainingData'
        evaluation:
          $ref: '#/components/schemas/Evaluation'
        ethical_considerations:
          $ref: '#/components/schemas/EthicalConsiderations'
        caveats_and_recommendations:
          $ref: '#/components/schemas/CaveatsAndRecommendations'

    ModelDetails:
      type: object
      properties:
        name:
          type: string
        version:
          type: string
        description:
          type: string
        authors:
          type: array
          items:
            type: string
        license:
          type: string

    IntendedUse:
      type: object
      properties:
        primary_uses:
          type: array
          items:
            type: string
        out_of_scope_uses:
          type: array
          items:
            type: string
        target_users:
          type: array
          items:
            type: string

    TrainingData:
      type: object
      properties:
        datasets:
          type: array
          items:
            type: string
        preprocessing:
          type: string

    Evaluation:
      type: object
      properties:
        metrics:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              value:
                type: number
              split:
                type: string

    EthicalConsiderations:
      type: object
      properties:
        bias_risks:
          type: array
          items:
            type: string
        mitigation_strategies:
          type: array
          items:
            type: string
        environmental_impact:
          type: object
          properties:
            carbon_kg:
              type: number
            energy_kwh:
              type: number
            hardware:
              type: string
            training_hours:
              type: number

    CaveatsAndRecommendations:
      type: object
      properties:
        known_limitations:
          type: array
          items:
            type: string
        recommendations:
          type: array
          items:
            type: string

    ComplianceReport:
      type: object
      properties:
        fips_140_3:
          type: object
          properties:
            compliant:
              type: boolean
            checks:
              type: array
              items:
                type: object
                properties:
                  name:
                    type: string
                  passed:
                    type: boolean
        cmmc_2_0:
          type: object
          properties:
            certified:
              type: boolean
            controls:
              type: array
              items:
                type: string
        mitre_attack:
          type: object
          properties:
            mitigated_techniques:
              type: array
              items:
                type: string

    VaultStats:
      type: object
      properties:
        total_models:
          type: integer
        total_versions:
          type: integer
        total_size_bytes:
          type: integer
          format: int64
        format_distribution:
          type: object
          additionalProperties:
            type: integer

    ConversionRequest:
      type: object
      required: [model, to_format]
      properties:
        model:
          type: string
        to_format:
          type: string
          enum: [safetensors, gguf, onnx, torchscript, coreml, mlx, tensorrt, openvino, tflite]
        version:
          type: integer
        quantization:
          type: string
          enum: [q4_0, q4_k_m, q5_k_m, q8_0]
        validate:
          type: boolean

    ConversionResult:
      type: object
      required: [converted, source_format, target_format, conversion_path, input_size, output_size]
      properties:
        converted:
          type: boolean
          description: >-
            True when `data_base64` holds real target-format bytes. False when the
            conversion requires external tooling — `data_base64` is then absent and
            `plan` describes the steps. Always check this before writing the payload
            to a file, or you will produce a file with the target extension and the
            wrong contents.
        data_base64:
          type: string
          description: Converted model bytes, base64-encoded. Absent when `converted` is false.
        plan:
          type: object
          description: >-
            Instructions for performing this conversion with external tooling
            (currently PyTorch→ONNX, ONNX→TensorRT, ONNX→CoreML, SafeTensors→GGUF).
            Present only when `converted` is false.
          properties:
            converter:
              type: string
            requires:
              type: array
              items:
                type: string
            python:
              type: string
            shell:
              type: string
        source_format:
          type: string
        target_format:
          type: string
        conversion_path:
          type: array
          items:
            type: string
        input_size:
          type: integer
          format: int64
        output_size:
          type: integer
          format: int64
          description: Zero when `converted` is false.
        validation:
          type: object
          nullable: true

    Document:
      type: object
      required: [id, content]
      properties:
        id:
          type: string
        content:
          type: string
        metadata:
          type: object
          additionalProperties:
            type: string
        embedding:
          type: array
          items:
            type: number
            format: float

    SearchResult:
      type: object
      properties:
        documents:
          type: array
          items:
            $ref: '#/components/schemas/Document'
        total:
          type: integer
        query_time_ms:
          type: number

    Error:
      type: object
      properties:
        error:
          type: string
        code:
          type: integer
        details:
          type: string

paths:
  /api/v1/health:
    get:
      summary: Health check
      tags: [Observability]
      security: []
      responses:
        '200':
          description: Service healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string

  /api/v1/auth/token:
    post:
      summary: Get JWT authentication token
      tags: [Auth]
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [passphrase]
              properties:
                passphrase:
                  type: string
      responses:
        '200':
          description: JWT token
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  expires_in:
                    type: integer

  /api/v1/stats:
    get:
      summary: Get vault statistics
      tags: [Vault]
      responses:
        '200':
          description: Vault statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VaultStats'

  /api/v1/models:
    get:
      summary: List all models
      tags: [Models]
      responses:
        '200':
          description: List of models
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ModelMetadata'

  /api/v1/models/{name}:
    get:
      summary: Get model (latest version binary)
      tags: [Models]
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Model binary
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
    post:
      summary: Store a new model
      tags: [Models]
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                format:
                  type: string
                description:
                  type: string
                framework:
                  type: string
                task:
                  type: string
      responses:
        '201':
          description: Model stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelVersion'

  /api/v1/models/{name}/versions:
    get:
      summary: List model versions
      tags: [Versions]
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Version list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ModelVersion'

  /api/v1/models/{name}/versions/{version}:
    get:
      summary: Get specific version (binary download)
      tags: [Versions]
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
        - name: version
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Model binary for specific version
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
    delete:
      summary: Delete a specific version
      tags: [Versions]
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
        - name: version
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Version deleted

  /api/v1/models/{name}/lineage/{version}:
    get:
      summary: Get version lineage tree
      tags: [Versions]
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
        - name: version
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Lineage tree
          content:
            application/json:
              schema:
                type: object

  /api/v1/models/{name}/card:
    get:
      summary: Generate model card from vault metadata
      tags: [Model Cards]
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Model card JSON
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelCard'
        '404':
          description: Model not found
    post:
      summary: Create or overwrite a custom model card
      tags: [Model Cards]
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelCard'
      responses:
        '201':
          description: Model card created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelCard'
        '400':
          description: Invalid model card JSON
        '404':
          description: Model not found

  /api/v1/compliance:
    get:
      summary: Run compliance checks (FIPS 140-3, CVE, MITRE ATT&CK, CMMC 2.0)
      tags: [Compliance]
      responses:
        '200':
          description: Compliance report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplianceReport'

  /api/v1/rag/search:
    post:
      summary: Search RAG knowledge base
      tags: [RAG]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query:
                  type: string
                limit:
                  type: integer
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResult'
        '400':
          description: Empty query

  /api/v1/rag/documents:
    post:
      summary: Add document to RAG knowledge base
      tags: [RAG]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                metadata:
                  type: object
                  additionalProperties:
                    type: string
      responses:
        '201':
          description: Document stored
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  content_length:
                    type: integer
        '400':
          description: Empty content

  /api/v1/convert:
    post:
      summary: Convert model format
      tags: [Conversion]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConversionRequest'
      responses:
        '200':
          description: Conversion result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversionResult'

  /api/v1/conversions:
    get:
      summary: List supported conversion paths
      tags: [Conversion]
      responses:
        '200':
          description: Conversion paths
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    from:
                      type: string
                    to:
                      type: string

  /api/v1/audit:
    get:
      summary: Get audit log entries
      description: Returns audit log. Non-admin JWT roles have security events filtered out.
      tags: [Observability]
      responses:
        '200':
          description: Audit log
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object

  /api/v1/metrics:
    get:
      summary: Get vault metrics
      tags: [Observability]
      responses:
        '200':
          description: Metrics data
          content:
            application/json:
              schema:
                type: object

  /api/v1/events:
    get:
      summary: Get recent events
      description: Returns recent events. Non-admin JWT roles have security events filtered out.
      tags: [Observability]
      responses:
        '200':
          description: Event stream
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object

  /api/v1/openapi.json:
    get:
      summary: Get OpenAPI specification
      tags: [Observability]
      security: []
      responses:
        '200':
          description: OpenAPI JSON spec
          content:
            application/json:
              schema:
                type: object

  # --- v1.4.0 endpoints ---

  /api/v1/models/{name}/tags:
    get:
      summary: Get model tags
      tags: [Tags]
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Model tags
    post:
      summary: Add tags to model
      tags: [Tags]
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                tags:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Tags added
    delete:
      summary: Remove tags from model
      tags: [Tags]
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                tags:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Tags removed

  /api/v1/search:
    post:
      summary: Search models by name, tags, or annotations
      tags: [Tags]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                query:
                  type: string
                tag:
                  type: string
      responses:
        '200':
          description: Search results

  /api/v1/acl:
    get:
      summary: List access control entries
      tags: [Access Control]
      responses:
        '200':
          description: ACL entries
    post:
      summary: Grant role to principal
      tags: [Access Control]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [principal, role]
              properties:
                principal:
                  type: string
                role:
                  type: string
                  enum: [reader, writer, admin]
      responses:
        '200':
          description: Role granted
    delete:
      summary: Revoke access from principal
      tags: [Access Control]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [principal]
              properties:
                principal:
                  type: string
      responses:
        '200':
          description: Access revoked

  /api/v1/webhooks:
    get:
      summary: List webhook targets
      tags: [Webhooks]
      responses:
        '200':
          description: Webhook list
    post:
      summary: Add webhook target
      tags: [Webhooks]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url:
                  type: string
                  format: uri
                secret:
                  type: string
      responses:
        '201':
          description: Webhook created

  /api/v1/webhooks/{id}:
    delete:
      summary: Remove webhook target
      tags: [Webhooks]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Webhook removed

  /api/v1/models/{name}/validate:
    post:
      summary: Validate model integrity
      tags: [Models]
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Validation result

  /api/v1/gc:
    post:
      summary: Run garbage collection
      tags: [Vault]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                dry_run:
                  type: boolean
      responses:
        '200':
          description: GC report

  /api/v1/models/{name}/policy:
    put:
      summary: Set retention policy for model
      tags: [Policies]
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                max_versions:
                  type: integer
                max_age_days:
                  type: integer
                keep_minimum:
                  type: integer
      responses:
        '200':
          description: Policy set

  /api/v1/policies:
    get:
      summary: List all retention policies
      tags: [Policies]
      responses:
        '200':
          description: Policy list

  /api/v1/profiles:
    get:
      summary: List configuration profiles
      tags: [Profiles]
      responses:
        '200':
          description: Profile list
    post:
      summary: Create configuration profile
      tags: [Profiles]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                description:
                  type: string
                overrides:
                  type: object
                  additionalProperties:
                    type: string
      responses:
        '201':
          description: Profile created

  /api/v1/profiles/{name}/activate:
    post:
      summary: Activate configuration profile
      tags: [Profiles]
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Profile activated

  /api/v1/lineage-graph:
    get:
      summary: Show cross-model lineage graph
      tags: [Lineage]
      responses:
        '200':
          description: Lineage graph
    post:
      summary: Add edge to lineage graph
      tags: [Lineage]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [child, parents, kind]
              properties:
                child:
                  type: string
                parents:
                  type: array
                  items:
                    type: string
                kind:
                  type: string
      responses:
        '201':
          description: Edge added

  /api/v1/plugins:
    get:
      summary: List installed plugins
      tags: [Plugins]
      responses:
        '200':
          description: Plugin list

  # --- v1.5.0 endpoints ---

  /api/v1/quantization/profiles:
    get:
      summary: List quantization profiles
      tags: [Quantization]
      responses:
        '200':
          description: Quantization profiles
    post:
      summary: Set quantization profile for model
      tags: [Quantization]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [model, method]
              properties:
                model:
                  type: string
                method:
                  type: string
                  enum: [q4_0, q4_k_m, q5_k_m, q8_0, f16, f32]
                version:
                  type: integer
                bits:
                  type: integer
      responses:
        '200':
          description: Profile set

  /api/v1/quantization/estimate:
    post:
      summary: Estimate quantized output size
      tags: [Quantization]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [model, method]
              properties:
                model:
                  type: string
                method:
                  type: string
      responses:
        '200':
          description: Size estimate

  /api/v1/evaluations:
    get:
      summary: List evaluation results
      tags: [Evaluation]
      parameters:
        - name: model
          in: query
          schema:
            type: string
        - name: version
          in: query
          schema:
            type: integer
        - name: suite
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Evaluation results
    post:
      summary: Record evaluation result
      tags: [Evaluation]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [model, suite, metric, score]
              properties:
                model:
                  type: string
                version:
                  type: integer
                suite:
                  type: string
                metric:
                  type: string
                score:
                  type: number
      responses:
        '201':
          description: Result recorded

  /api/v1/evaluations/suites:
    get:
      summary: List known evaluation suites
      tags: [Evaluation]
      responses:
        '200':
          description: Suite list

  /api/v1/backups/schedules:
    get:
      summary: List backup schedules
      tags: [Backups]
      responses:
        '200':
          description: Schedule list
    post:
      summary: Create or update backup schedule
      tags: [Backups]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [vault, interval]
              properties:
                vault:
                  type: string
                interval:
                  type: string
                  enum: [daily, weekly, monthly, custom]
                hour:
                  type: integer
      responses:
        '200':
          description: Schedule set

  /api/v1/backups/history:
    get:
      summary: Get backup history
      tags: [Backups]
      parameters:
        - name: vault
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Backup history

  /api/v1/vaults:
    get:
      summary: List registered vaults
      tags: [Multi-Vault]
      responses:
        '200':
          description: Vault list
    post:
      summary: Register a new vault
      tags: [Multi-Vault]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name, path]
              properties:
                name:
                  type: string
                path:
                  type: string
      responses:
        '201':
          description: Vault registered

  /api/v1/vaults/{name}/activate:
    post:
      summary: Activate a registered vault
      tags: [Multi-Vault]
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Vault activated

  /api/v1/models/{name}/sign:
    post:
      summary: Generate an HMAC-SHA256 signature for a model
      tags: [Signing]
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                version:
                  type: integer
                identity:
                  type: string
                key:
                  type: string
                  description: HMAC key (or resolved via KMS)
      responses:
        '200':
          description: Signature generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  signature_path:
                    type: string
                  algorithm:
                    type: string
                    example: HMAC-SHA256

  /api/v1/models/{name}/verify:
    post:
      summary: Verify a model signature
      tags: [Signing]
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [signature_path]
              properties:
                signature_path:
                  type: string
                key:
                  type: string
      responses:
        '200':
          description: Verification result
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: boolean

  /api/v1/models/{name}/scan:
    post:
      summary: Scan a model for unsafe pickle opcodes / patterns
      tags: [Safety]
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                version:
                  type: integer
      responses:
        '200':
          description: Scan report
          content:
            application/json:
              schema:
                type: object
                properties:
                  safe:
                    type: boolean
                  findings:
                    type: array
                    items:
                      type: object

  /api/v1/models/diff:
    post:
      summary: Diff two model artifacts at the tensor level
      tags: [Diffing]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [left, right]
              properties:
                left:
                  type: string
                  description: File path or name@version
                right:
                  type: string
                  description: File path or name@version
      responses:
        '200':
          description: Diff report
          content:
            application/json:
              schema:
                type: object

  /api/v1/models/pull:
    post:
      summary: Download a model from HuggingFace, Ollama, or a URL
      tags: [Download]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source]
              properties:
                source:
                  type: string
                  description: huggingface://owner/repo, ollama://name, or https URL
                sha256:
                  type: string
                token:
                  type: string
                store:
                  type: boolean
                name:
                  type: string
      responses:
        '200':
          description: Download report

  /api/v1/license-scan:
    post:
      summary: Scan a path for model licenses; returns SPDX identifiers
      tags: [License]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path:
                  type: string
      responses:
        '200':
          description: License findings

  /api/v1/models/{name}/card/validate:
    post:
      summary: Validate a model card against the schema
      tags: [Cards]
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Validation result

  /api/v1/models/{name}/card/generate:
    post:
      summary: Auto-generate a model card from existing metadata
      tags: [Cards]
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Generated card

  /api/v1/models/{name}/benchmarks:
    get:
      summary: Show benchmark scores for a model
      tags: [Benchmarks]
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Benchmark scores
    post:
      summary: Record a benchmark score
      tags: [Benchmarks]
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, benchmark, score, unit]
              properties:
                version:
                  type: integer
                benchmark:
                  type: string
                score:
                  type: number
                unit:
                  type: string
      responses:
        '201':
          description: Benchmark recorded

  /api/v1/models/{name}/register:
    post:
      summary: Register a model with a local inference engine (Ollama or LM Studio)
      tags: [Interop]
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [engine]
              properties:
                engine:
                  type: string
                  enum: [ollama, lm-studio]
                alias:
                  type: string
                system_prompt:
                  type: string
      responses:
        '200':
          description: Registered

  /api/v1/vault/export:
    post:
      summary: Export the active vault as a tar.gz bundle
      tags: [Bundle]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [output]
              properties:
                output:
                  type: string
      responses:
        '200':
          description: Bundle written

  /api/v1/vault/import:
    post:
      summary: Import a vault bundle (tar.gz)
      tags: [Bundle]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [archive]
              properties:
                archive:
                  type: string
                target:
                  type: string
      responses:
        '200':
          description: Bundle imported

  /api/v1/telemetry/status:
    get:
      summary: Show telemetry configuration status
      tags: [Telemetry]
      responses:
        '200':
          description: Telemetry status
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled:
                    type: boolean
                  do_not_track:
                    type: boolean

  /api/v1/introspect:
    get:
      summary: Return the CLI schema for agent bootstrapping
      tags: [Discovery]
      parameters:
        - name: format
          in: query
          schema:
            type: string
            enum: [json, yaml, jsonld]
            default: json
        - name: compact
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: CLI schema

tags:
  - name: Auth
