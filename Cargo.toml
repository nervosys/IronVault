[package]
name = "ironvault"
version = "7.2.1"
edition = "2021"
rust-version = "1.89"
authors = ["NERVOSYS AI Team"]
description = "Universal cross-platform XDG-compliant secure vault for AI model formats (Neural and Neurosymbolic)"
license = "AGPL-3.0-or-later"
repository = "https://github.com/nervosys/IronVault"
homepage = "https://github.com/nervosys/IronVault"
documentation = "https://docs.rs/ironvault"
readme = "README.md"
keywords = ["ai", "ml", "vault", "encryption", "model-management"]
categories = ["cryptography", "command-line-utilities", "science"]

# Keep the published crate to what a consumer needs: sources, examples, tests,
# benches, the docs, and the `.well-known/` discovery manifests this project is
# built around. Everything below is repository infrastructure that only bloated
# the download.
exclude = [
    "website/",
    "reports/",
    "deploy/",
    "scripts/",
    "fuzz/",
    ".github/",
    "videos/",
    "media/",
    "htmlcov/",
    ".venv/",
    ".cache/",
    ".pytest_cache/",
    "tarpaulin-report.json",
    ".coverage",
    "uv.lock",
]

[dependencies]
# Cryptography - FIPS-approved algorithms (implementations are not CMVP-validated)
aes-gcm = "0.11"                                     # AES-GCM encryption
sha2 = "0.10"                                        # SHA-256 hashing
argon2 = "0.5"                                       # Alternative KDF (more secure than PBKDF2)
# The CSPRNG behind salts, nonces and key seeds. Named directly rather than
# taken from whichever crypto crate happens to re-export one: 0.10 got it from
# `aes_gcm::aead`, 0.11 dropped that re-export, and the compiler found every
# use site only because they were all in two files. 0.6 is the version
# `argon2` already pulls in through `password_hash`, so this adds no crate to
# the build, and its `RngCore` is infallible -- `rand_core` 0.9 would make
# `VaultCrypto::generate_random` fallible, which is a better shape but a
# breaking change to a public method.
rand_core = { version = "0.6.4", features = ["getrandom"] }
zeroize = { version = "1.7", features = ["derive"] } # Secure memory zeroing

# Compression
# The GGUF wire format, shared with IronWorks so the writer here and the
# reader there cannot drift. Depends on `half` and nothing else — this crate
# must not drag an inference engine into the vault.
gguf-quant = "0.1"
flate2 = "1.0"  # Gzip/zlib compression
lzma-rs = "0.3" # LZMA compression

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10"
toml = "0.8"

# File I/O and paths
tokio = { version = "1.35", features = ["full"] } # Async runtime
async-trait = "0.1"                               # Async trait support
bytes = "1.5"
tar = "0.4"                                       # TAR archive support
zip = "4"                                         # ZIP archive support

# Cloud storage backends (optional)
# Note: cloud-storage has unmaintained dependencies (ring 0.16, dotenv, instant)
# Consider using direct AWS/Azure SDKs for production
# `default-features = false` drops the SDKs' legacy `rustls` feature, which
# selects the hyper-0.14 / rustls-0.21 stack and drags in the unmaintained
# rustls-webpki 0.101 (RUSTSEC-2026-0098/0099/0104). `default-https-client`
# selects the modern rustls-aws-lc client instead.
aws-config = { version = "1.10", optional = true }
aws-sdk-s3 = { version = "1.140", optional = true, default-features = false, features = [
    "sigv4a",
    "http-1x",
    "default-https-client",
    "rt-tokio",
    "behavior-version-latest",
] }
aws-sdk-secretsmanager = { version = "1.111", optional = true, default-features = false, features = [
    "default-https-client",
    "rt-tokio",
    "behavior-version-latest",
] }
# Azure SDK for Rust v1. The legacy azure_storage/azure_storage_blobs line ended
# at azure_core 0.21, which pins quick-xml 0.31 (RUSTSEC-2026-0194/0195); this
# stack uses quick-xml 0.41. It authenticates with Entra ID or a SAS URL only —
# there is no shared-key credential, so AZURE_STORAGE_KEY is not supported.
azure_storage_blob = { version = "1.1.0-beta.1", optional = true }
azure_core = { version = "1.1", optional = true }
azure_identity = { version = "1.0", optional = true }
url = { version = "2.5", optional = true }
futures-util = { version = "0.3", optional = true } # StreamExt for Azure blob pagination
# cloud-storage = { version = "0.11", optional = true }  # Disabled due to security issues

# XDG compliance
directories = "5.0" # XDG base directories

# Concurrency
parking_lot = "0.12" # Fast mutex for telemetry

# System info
hostname = "0.4"

# Async streams (for GraphQL subscriptions)
async-stream = "0.3"

# HTTP client for telemetry
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "json",
    "rustls-tls",
] }

# Error handling
thiserror = "2.0"

# Logging and auditing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }

# CLI
clap = { version = "4.4", features = ["derive", "env"] }
rpassword = "7.3"
hex = "0.4"
tempfile = "3.8"
# NOTE: the `safetensors` and `ndarray` crates were removed in 4.6.0. Both were
# optional dependencies enabled by default that no code ever called -- there is
# no `safetensors::` or `ndarray::` path anywhere in the tree, and neither
# feature gated any `#[cfg]`. They compiled into every default install, adding
# ~25 transitive crates plus their advisory surface, in exchange for nothing.
# SafeTensors parsing is implemented in `src/formats.rs` and never used the
# upstream crate. The feature *names* are kept below as no-ops so that
# `--features safetensors` keeps resolving for anyone who passes it.

# UUID generation
uuid = { version = "1.6", features = ["v4", "serde"] }

# REST API (optional)
axum = { version = "0.7", features = ["json", "multipart"], optional = true }
tower = { version = "0.5", optional = true }
tower-http = { version = "0.6", features = [
    "cors",
    "trace",
    "limit",
    "timeout",
], optional = true }
# `default-features = false` + an explicit provider is mandatory from 11.0 on.
# Without exactly one of `rust_crypto` / `aws_lc_rs`, the crate compiles but
# **panics at runtime** on the first sign or verify ("Could not automatically
# determine the process-level CryptoProvider"). A bare version bump therefore
# builds green and ships an API whose every authenticated request crashes.
# `rust_crypto` matches the pure-Rust posture of the rest of the crypto stack
# (`aes-gcm`, `argon2`) and keeps the build toolchain-free. `aws_lc_rs` was
# tried and rejected: aws-lc-sys hard-requires NASM on x86_64-pc-windows-msvc
# and a C compiler everywhere else, so it fails outright for anyone running
# `cargo install ironvault --features api` on Windows.
#
# The cost of `rust_crypto` is that it pulls in `rsa`, which carries
# RUSTSEC-2023-0071 with no fixed release. That advisory is suppressed in
# `.cargo/audit.toml` and `deny.toml`; see those files for why it is
# unreachable here.
jsonwebtoken = { version = "11.0", optional = true, default-features = false, features = [
    "rust_crypto",
] }
utoipa = { version = "5", features = ["axum_extras"], optional = true }
base64 = { version = "0.23", optional = true }
hyper = { version = "1.4", optional = true }
# In-process TLS. The server refuses to bind a non-loopback address without it,
# because `POST /auth/token` carries the vault passphrase — see `ApiConfig::tls_key`.
# `rustls` rather than native-tls so there is no OpenSSL build dependency.
axum-server = { version = "0.7", features = [
    "tls-rustls",
], optional = true }

# GraphQL API (optional)
async-graphql = { version = "7.0", features = [
    "chrono",
    "uuid",
], optional = true }
async-graphql-axum = { version = "7.0", optional = true }

# Python bindings (optional)
pyo3 = { version = "0.29", features = ["extension-module"], optional = true }

# Database support for RAG
rusqlite = { version = "0.31", features = [
    "bundled",
    "serde_json",
], optional = true }
sled = { version = "0.34", optional = true }
# Vector database support (optional)
qdrant-client = { version = "1.13", optional = true }
# OpenTelemetry OTLP export (optional, `otel` feature).
# `reqwest-blocking-client` matches the existing telemetry sender, which
# already runs its flush on a detached std thread rather than a runtime.
opentelemetry = { version = "0.32", optional = true }
opentelemetry_sdk = { version = "0.32", optional = true, features = ["logs"] }
opentelemetry-otlp = { version = "0.32", optional = true, default-features = false, features = [
    "logs",
    "http-proto",
    "http-json",
    "reqwest-blocking-client",
] }
# lancedb removed: v0.4 depends on arrow-arith v51 which is incompatible with Rust 1.93+

[dev-dependencies]
criterion = "0.8"
proptest = "1.4"
assert_cmd = "2.1.2"
predicates = "3.1.4"

[features]
default = ["safetensors", "ndarray", "sqlite"]
full = ["safetensors", "ndarray", "sqlite", "sled", "vector-db"]
# Kept as no-ops after the crates behind them were removed in 4.6.0, so an
# existing `--features safetensors` or `--features ndarray` still resolves
# instead of failing the build. SafeTensors support itself is unaffected: it
# lives in `src/formats.rs` and never used the upstream crate.
safetensors = []
ndarray = []
# Database features
sqlite = ["rusqlite"]
kv-store = ["sled"]
vector-db = ["qdrant-client"]
database = ["sqlite", "kv-store"]
# Cloud storage features
s3 = ["aws-config", "aws-sdk-s3", "aws-sdk-secretsmanager"]
azure = ["azure_storage_blob", "azure_core", "azure_identity", "url", "futures-util"]
# gcs = ["cloud-storage"]  # Disabled due to security vulnerabilities in cloud-storage crate
cloud = ["s3", "azure"] # GCS removed until cloud-storage is updated
# REST API
api = [
    "axum",
    "tower",
    "tower-http",
    "jsonwebtoken",
    "utoipa",
    "base64",
    "hyper",
    "axum-server",
]
# GraphQL API (requires api)
graphql = ["api", "async-graphql"]
# Python native bindings
python = ["dep:pyo3"]
# OTLP export for telemetry events. Off by default: it pulls in prost and the
# OpenTelemetry SDK, and enabling the feature must never be what turns
# telemetry on -- that stays opt-in via config or `iv telemetry enable`.
otel = ["dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-otlp"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# Pedantic lints allowed project-wide (noisy / stylistic / not actionable)
assigning_clones = "allow"
case_sensitive_file_extension_comparisons = "allow"
cast_lossless = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
checked_conversions = "allow"
doc_markdown = "allow"
format_push_string = "allow"
if_not_else = "allow"
implicit_clone = "allow"
inefficient_to_string = "allow"
items_after_statements = "allow"
manual_let_else = "allow"
map_unwrap_or = "allow"
match_same_arms = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
needless_pass_by_value = "allow"
needless_raw_string_hashes = "allow"
redundant_closure_for_method_calls = "allow"
return_self_not_must_use = "allow"
similar_names = "allow"
too_many_lines = "allow"
uninlined_format_args = "allow"
unnecessary_debug_formatting = "allow"
unnecessary_literal_bound = "allow"
unnecessary_wraps = "allow"
unreadable_literal = "allow"
unused_async = "allow"
unused_self = "allow"
used_underscore_binding = "allow"
wildcard_imports = "allow"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0

# `bench = false` on both: without it `cargo bench` also runs the built-in
# libtest harness for the lib and the binary, which does not understand
# criterion's `--output-format bencher` and aborts with "Unrecognized option"
# before any benchmark runs. The criterion benches below set `harness = false`
# and are the only intended bench targets.
[[bin]]
name = "iv"
path = "src/main.rs"
bench = false

[lib]
name = "ironvault"
path = "src/lib.rs"
bench = false

[[bench]]
name = "crypto_bench"
harness = false

[[bench]]
name = "vault_bench"
harness = false

[[bench]]
name = "api_bench"
harness = false
required-features = ["api"]

[[bench]]
name = "module_bench"
harness = false

[[bench]]
name = "feature_bench"
harness = false
