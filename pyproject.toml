[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "ironvault"
version = "6.2.0"
description = "Universal cross-platform XDG-compliant secure vault for AI model formats"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "NERVOSYS AI Team" }]
keywords = ["ai", "ml", "vault", "security", "model-conversion", "encryption"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Rust",
    "Topic :: Security :: Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Keep `dependencies` inside [project]. TOML scopes every key to the table
# header above it, so moving this below [project.urls] silently redefines it as
# `project.urls.dependencies` — the package then declares no runtime
# dependencies at all and maturin rejects the manifest.
dependencies = [
    "cryptography>=42.0.0", # FIPS-approved algorithms (not a CMVP-validated module)
    "pyyaml>=6.0",
    "click>=8.0",
    "tqdm>=4.65.0",
    "platformdirs>=4.0.0",  # XDG compliance
    "filelock>=3.12.0",
    "jsonschema>=4.19.0",
    "packaging>=23.0",
]

[project.urls]
Homepage = "https://github.com/nervosys/IronVault"
Documentation = "https://github.com/nervosys/IronVault/tree/master/docs"
Repository = "https://github.com/nervosys/IronVault"
Issues = "https://github.com/nervosys/IronVault/issues"
Changelog = "https://github.com/nervosys/IronVault/blob/master/CHANGELOG.md"

[project.optional-dependencies]
ml = [
    # Model format support (multi-GB, install only when needed)
    "torch>=2.0.0",
    "tensorflow>=2.13.0",
    "onnx>=1.14.0",
    "safetensors>=0.4.0",
    "numpy>=1.24.0",
    "h5py>=3.9.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.7.0",
    "ruff>=0.0.286",
    "mypy>=1.5.0",
    "pre-commit>=3.3.0",
]
security = [
    "safety>=2.3.0",    # CVE scanning
    "bandit>=1.7.5",    # Security linting
    "pip-audit>=2.6.0", # Dependency vulnerability scanning
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mkdocs-minify-plugin>=0.8.0",
    "pymdown-extensions>=10.7.0",
]

[project.scripts]
ironvault = "ironvault.cli:main"

[tool.maturin]
python-source = "src"
module-name = "ironvault._native"
features = ["pyo3/extension-module", "python"]
manifest-path = "Cargo.toml"
bindings = "pyo3"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --cov=ironvault --cov-report=html --cov-report=term"

[tool.black]
line-length = 100
target-version = ['py39']

[tool.ruff]
line-length = 100
target-version = "py39"
select = ["E", "F", "I", "N", "W", "B", "S"] # S for security checks

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
